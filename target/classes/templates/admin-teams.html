<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Teams</title>
</head>

<body>

<div class="logout-link" style="float:right; margin-bottom:10px;">
    <a th:href="@{/logout}" onclick="return confirm('Logout?')">
        Logout
    </a>
</div>

<h2>Create Team</h2>

<form th:action="@{/admin/teams/create}" method="post">

    Team Name:
    <input type="text" name="name" required>

    Manager:

    <select name="managerId">

        <option value="">Select Manager</option>

        <option th:each="m : ${managers}"
                th:value="${m.id}"
                th:text="${m.username}">
        </option>

    </select>

    <button type="submit">Create Team</button>

</form>

<br><br>

<h2>Teams</h2>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Team Name</th>
        <th>Manager</th>
        <th>Actions</th>
    </tr>

    <tr th:each="team : ${teams}">

        <td th:text="${team.id}"></td>

        <td th:text="${team.name}"></td>

        <td th:text="${team.manager != null ? team.manager.username : 'No Manager'}"></td>

        <td>

            <a th:href="@{/admin/teams/edit/{id}(id=${team.id})}">
                Edit
            </a>

            <!-- DELETE -->
            <a th:href="@{/admin/teams/delete/{id}(id=${team.id})}"
               onclick="return confirm('Are you sure you want to delete team?')">
                Delete
            </a>

        </td>

    </tr>

</table>

</body>
</html>
