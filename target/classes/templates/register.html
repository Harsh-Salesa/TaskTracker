<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body class="auth-body">

<div class="auth-container">

    <h2>Register</h2>

    <form th:action="@{/register}" th:object="${user}" method="post">

        <!-- Username -->
        <input type="text" th:field="*{username}" placeholder="Username"
               th:classappend="${#fields.hasErrors('username')} ? 'error' : ''"/>
        <p class="error-text"
           th:if="${#fields.hasErrors('username')}"
           th:errors="*{username}"></p>

        <!-- Email -->
        <input type="email" th:field="*{email}" placeholder="Email"
               th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"/>
        <p class="error-text"
           th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>

        <!-- Password -->
        <input type="password" th:field="*{password}" placeholder="Password"
               th:classappend="${#fields.hasErrors('password')} ? 'error' : ''"/>
        <p class="error-text"
           th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></p>

        <button type="submit">Register</button>

    </form>

    <div class="link">
        <a th:href="@{/login}">Already have an account? Login</a>
    </div>

</div>

</body>
</html>
