<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-body">
<div class="auth-container">

    <h2>Login</h2>

    <form th:action="@{/login-form}" th:object="${loginRequest}" method="post" onsubmit="handleSubmit()">

        <!-- Username / Email -->
        <input type="text" th:field="*{loginInput}" placeholder="Email or Username"
               th:classappend="${#fields.hasErrors('loginInput')} ? 'error' : ''"/>

        <p class="error-text"
           th:if="${#fields.hasErrors('loginInput')}"
           th:errors="*{loginInput}"></p>

        <!-- Password with toggle -->
        <div class="password-wrapper">
            <input type="password" id="password" th:field="*{password}" placeholder="Password"
                   th:classappend="${#fields.hasErrors('password')} ? 'error' : ''"/>

            <span class="toggle-password" onclick="togglePassword()">👁</span>
        </div>

        <p class="error-text"
           th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></p>

        <!-- Remember Me -->
        <div class="remember-me">
            <input type="checkbox" name="rememberMe"> Remember me
        </div>

        <!-- Backend error -->
        <p class="error-text" th:if="${error}" th:text="${error}"></p>

        <button type="submit" id="loginBtn">Login</button>

    </form>

    <div class="link">
        <a th:href="@{/register}">Don't have an account? Register</a>
    </div>

</div>

<!-- JS -->
<script>
    function togglePassword() {
        const pwd = document.getElementById("password");
        pwd.type = pwd.type === "password" ? "text" : "password";
    }

    function handleSubmit() {
        const btn = document.getElementById("loginBtn");
        btn.disabled = true;
        btn.innerText = "Logging in...";
    }
</script>

</body>
</html>
