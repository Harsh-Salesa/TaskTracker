<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Team</title>
</head>

<body>

<h2>My Team Members</h2>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
    </tr>

    <tr th:each="user : ${teamMembers}">

        <td th:text="${user.id}"></td>

        <td th:text="${user.username}"></td>

        <td th:text="${user.email}"></td>

    </tr>

</table>

</body>
</html>
