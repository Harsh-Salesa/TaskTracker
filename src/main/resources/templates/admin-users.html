<h2>User Management</h2>

<table>

<tr>
<th>ID</th>
<th>Email</th>
<th>Role</th>
<th>Actions</th>
</tr>

<tr th:each="user : ${users}">

<td th:text="${user.id}"></td>
<td th:text="${user.email}"></td>
<td th:text="${user.role}"></td>

<td>

<a th:href="@{/admin/promote/{id}(id=${user.id})}">
Make Manager
</a>

</td>

</tr>

</table>
