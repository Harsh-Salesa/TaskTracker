<div class="logout-link" style="float:right; margin-bottom:10px;" xmlns:th="http://www.w3.org/1999/xhtml">
    <a th:href="@{/logout}" onclick="return confirm('Are you sure you want to logout?')">
        Logout
    </a>
</div>

<h2>Manager Tasks</h2>
<a th:href="@{/manager/team}">My Team</a>
<a th:href="@{/tasks/insert}" class="btn-add">Create Task</a>

<br><br>

<table>

    <tr>
        <th>ID</th>
        <th>Task</th>
        <th>Status</th>
        <th>Assigned To</th>
        <th>Assign Task</th>
        <th>Actions</th>
    </tr>

    <tr th:each="todo : ${todos}">

        <td th:text="${todo.id}"></td>

        <td th:text="${todo.taskname}"></td>

        <td th:text="${todo.status}"></td>

        <td th:text="${todo.assignedTo != null ? todo.assignedTo.username : 'Not Assigned'}"></td>

        <!-- Assign Task -->
        <td>

            <form th:action="@{/manager/assign}" method="post">

                <input type="hidden" name="taskId" th:value="${todo.id}"/>

                <select name="userId">

                    <option th:each="u : ${users}"
                            th:value="${u.id}"
                            th:text="${u.username}">
                    </option>

                </select>

                <button type="submit">Assign</button>

            </form>

        </td>

        <!-- Update Delete -->
        <td>

            <a th:href="@{/tasks/update/{id}(id=${todo.id})}" class="btn-update">
                Update
            </a>

            <a th:href="@{/tasks/delete/{id}(id=${todo.id})}"
               onclick="return confirm('Are you sure you want to delete this task?')">
                Delete
            </a>

        </td>

    </tr>

</table>
